<!DOCTYPE html>
<html lang="en">
<head><title>Booking.com</title></head>
<!-- No property mark, as on a block page that keeps the /hotel/ path. The
     priced room table means only the missing mark keeps the date from reading
     as available. -->
<body>
  <table id="hprt-table" class="hprt-table">
    <thead>
      <tr class="hprt-table-header">
        <th class="hprt-table-header-cell -first">Room type</th>
        <th class="hprt-table-header-cell hprt-table-header-price">Price for 3 nights</th>
      </tr>
    </thead>
    <tbody>
      <tr class="js-rt-block-row e2e-hprt-table-row">
        <td class="hprt-table-cell -first hprt-table-cell-roomtype">Deluxe Double Room</td>
        <td class="hp-price-left-align hprt-table-cell hprt-table-cell-price">€450</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
