name: Check Availability

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without sending alerts or writing state'
        type: boolean
        default: false

jobs:
  # The repo and its logs are public, so this job outputs only the numbers of
  # the enabled Sheet rows. Each check job reads its watchdog from its own row.
  list-rows:
    runs-on: ubuntu-26.04
    outputs:
      rows: ${{ steps.rows.outputs.rows }}
    steps:
      - name: Random delay
        run: sleep $((RANDOM % 3600))

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: List enabled rows
        id: rows
        run: node src/config.mjs
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

  check:
    needs: list-rows
    if: needs.list-rows.outputs.rows != '[]'
    name: Check row ${{ matrix.row }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJson(needs.list-rows.outputs.rows) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Check availability
        run: node src/check.mjs
        env:
          WATCHDOG_ROW: ${{ matrix.row }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}

