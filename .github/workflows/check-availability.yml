name: Check Availability

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without sending alerts or writing state'
        type: boolean
        default: false

jobs:
  # The repo and its logs are public, so this job outputs only the numbers of
  # the enabled Sheet rows. Each check job reads its watchdog from its own row.
  list-rows:
    runs-on: ubuntu-26.04
    outputs:
      rows: ${{ steps.rows.outputs.rows }}
    steps:
      - name: Random delay
        run: sleep $((RANDOM % 3600))

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: List enabled rows
        id: rows
        run: node src/config.mjs
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

  check:
    needs: list-rows
    if: needs.list-rows.outputs.rows != '[]'
    name: Check row ${{ matrix.row }}
    runs-on: ubuntu-26.04
    # `MAX_WINDOW_DAYS` in validate.mjs, `CONCURRENCY` in scraper.mjs and
    # `SLACK_TIMEOUT_MS` in slack.mjs are sized for this limit. Check them when
    # you change it.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJson(needs.list-rows.outputs.rows) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Check availability
        run: node src/check.mjs
        env:
          WATCHDOG_ROW: ${{ matrix.row }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}

  # GitHub disables scheduled workflows in a public repo after 60 days without
  # repository activity. If that happens here, the watchdogs stop and no alert
  # goes out. This job enables every workflow that is active or was disabled
  # for inactivity, as GitHub's "Continue running workflow" button does.
  # GitHub doesn't document that this resets the 60 days. A workflow you
  # disable by hand is `disabled_manually` and stays off.
  keepalive:
    name: Keep workflows enabled
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Enable workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows" --paginate \
            --jq '.workflows[] | select(.state == "active" or .state == "disabled_inactivity") | [.id, .path, .state] | @tsv' \
            | while IFS=$'\t' read -r id path state; do
                gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$id/enable"
                echo "Enabled $path, was $state"
              done
